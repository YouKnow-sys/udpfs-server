name: ci

on:
  push:
    branches: [master]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: android-actions/setup-android@v3

      - name: Ensure an NDK is present
        run: |
          if [ -z "$(ls -A "$ANDROID_HOME/ndk" 2>/dev/null)" ]; then
            yes | sdkmanager --licenses >/dev/null
            yes | sdkmanager "ndk;28.2.13676358" >/dev/null
          fi

      - name: Install gomobile toolchain (pinned to go.mod's x/mobile)
        run: |
          go install golang.org/x/mobile/cmd/gomobile@v0.0.0-20260819173332-ba33198847ac
          go install golang.org/x/mobile/cmd/gobind@v0.0.0-20260819173332-ba33198847ac
          gomobile init

      - name: Build bridge AAR
        run: make aar

      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 -d > release.jks

      - name: Lint and assemble split-ABI release APKs
        env:
          UDPFS_STORE_FILE: release.jks
          UDPFS_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          UDPFS_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          UDPFS_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew ktlintCheck assembleRelease -PabiSplits=true

      - uses: actions/upload-artifact@v4
        with:
          name: release-apks
          path: udpfs-server/build/outputs/apk/release/*.apk
